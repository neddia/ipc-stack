services:
  # Own the shared loopback/network namespace used by site-agent and the
  # simulated miner fleet. Keeping ownership outside site-agent prevents a
  # site-agent restart from stranding the simulator in the old namespace.
  sim-netns:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    restart: unless-stopped
    ports:
      - "${SITE_AGENT_BIND_HOST:-0.0.0.0}:${SITE_AGENT_HOST_PORT:-8000}:8000"
    networks:
      - default
      - cloud_core
    extra_hosts:
      - "host.docker.internal:host-gateway"

  modbus-sim:
    profiles: ["sim"]
    image: local/site-agent:dev
    build:
      context: ${SETPOINT_DIR:-../setpoint}
      dockerfile: docker/site-agent.Dockerfile
    volumes:
      - ${SETPOINT_DIR:-../setpoint}/tools:/app/tools
    command: ["python", "/app/tools/sims/modbus_sim.py"]
    # Replaces the image's check, which calls site-agent's HTTP port. Reads one
    # register, so a hung simulator fails even though the kernel accepts the connection.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1502 && printf '\\x01\\x01\\x00\\x00\\x00\\x06\\x01\\x03\\x00\\x00\\x00\\x01' >&3 && read -r -t 3 -n 1 -u 3 reply"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  fake-miner-fleet:
    profiles: ["sim"]
    image: local/site-agent:dev
    build:
      context: ${SETPOINT_DIR:-../setpoint}
      dockerfile: docker/site-agent.Dockerfile
    depends_on:
      sim-netns:
        condition: service_started
      site-agent:
        condition: service_started
    network_mode: "service:sim-netns"
    environment:
      SITE_CONFIG_PATH: /app/storage/site-config.sim.yml
      SITE_AGENT_BASE_URL: http://127.0.0.1:8000
      SIM_MINER_PORT: 4028
    volumes:
      - ${SETPOINT_DIR:-../setpoint}/tools:/app/tools
      - ${IPC_STORAGE_DIR:-../setpoint/storage}:/app/storage
    command: ["python", "/app/tools/sims/fake_cgminer_fleet.py"]
    # Replaces the image's check, which reaches site-agent through the shared
    # namespace. Asks the first miner in storage/site-config.sim.yml for a summary.
    # Exit 1 is a miner closing the connection while it reboots after an overheat,
    # which still shows the fleet is running. Only a refusal or a timeout fails.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.77.1.1/4028 && printf '{\"command\":\"summary\"}' >&3 && { read -r -t 3 -d '' -u 3 reply; [ $$? -le 1 ]; }"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  site-agent:
    image: local/site-agent:dev
    build:
      context: ${SETPOINT_DIR:-../setpoint}
      dockerfile: docker/site-agent.Dockerfile
    environment:
      SITE_CONFIG_PATH: /app/storage/site-config.sim.yml
      BUILTIN_PROFILES_DIR: /app/profiles
      SITE_PROFILES_DIR: /app/storage/site-profiles
      # Development-only controls such as the zone page's re-map button.
      SITE_AGENT_DEV_TOOLS: "1"
    volumes:
      - ${SETPOINT_DIR:-../setpoint}/site-agent:/app/site-agent
      - ${SETPOINT_DIR:-../setpoint}/profiles:/app/profiles:ro
    depends_on:
      influxdb:
        condition: service_started
      sim-netns:
        condition: service_started
    network_mode: "service:sim-netns"
    ports: !reset []
    extra_hosts: !reset []
    # Watch only code: /app also holds storage (ledgers, simulator runs).
    # Without watchfiles, --reload scans the files on this delay (default 0.25s).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-delay", "1", "--reload-dir", "/app/site-agent"]

  tailwind:
    profiles: ["ui"]
    image: local/site-agent:dev
    build:
      context: ${SETPOINT_DIR:-../setpoint}
      dockerfile: docker/site-agent.Dockerfile
    volumes:
      - ${SETPOINT_DIR:-../setpoint}/site-agent:/app/site-agent
      - ${SETPOINT_DIR:-../setpoint}/tailwind.config.js:/app/tailwind.config.js
      - ${SETPOINT_DIR:-../setpoint}/bin/tailwindcss:/app/bin/tailwindcss
    working_dir: /app
    command:
      - /app/bin/tailwindcss
      - -c
      - /app/tailwind.config.js
      - -i
      - /app/site-agent/app/static/src/tailwind.css
      - -o
      - /app/site-agent/app/static/tailwind.css
      - --watch=always
    # Replaces the image's check, which calls site-agent's HTTP port. Tailwind serves
    # nothing, so healthy means the CSS exists. Comparing file times would fail after
    # any save that doesn't change the CSS, because Tailwind then leaves the file alone.
    healthcheck:
      test: ["CMD-SHELL", "test -s /app/site-agent/app/static/tailwind.css"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

networks:
  cloud_core:
    external: true
    name: toops-cloud_cloud_core
